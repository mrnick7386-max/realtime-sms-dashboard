<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME PANEL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Dashboard - Direct Access -->
    <div id="mainDashboard" class="main-dashboard">
        <div class="container">
            <!-- Header -->
            <header>
                <h1>📱 PRIME PANEL</h1>
                <div class="stats">
                    <div class="stat-box online-box">
                        <span class="stat-value" id="onlineCount">0</span>
                        <span class="stat-label">ONLINE</span>
                    </div>
                    <div class="stat-box sms-box">
                        <span class="stat-value" id="smsCount">0</span>
                        <span class="stat-label">NEW SMS</span>
                    </div>
                </div>
                
                <!-- Toggle -->
                <div class="toggle-section">
                    <button id="toggleBtn" class="toggle-btn active" onclick="toggleDevices()">
                        <span class="toggle-icon">📱</span>
                        All Devices
                    </button>
                    <button id="toggleBtnOnline" class="toggle-btn" onclick="toggleDevices()">
                        <span class="toggle-icon">🟢</span>
                        Online Only
                    </button>
                </div>

                <div class="controls">
                    <span id="lastUpdate" class="last-update">Loading data...</span>
                    <button id="refreshBtn" onclick="fetchAllData()">🔄 Refresh</button>
                </div>
            </header>

            <!-- Global Message Feed -->
            <section class="feed-section">
                <h2>🌐 Global Message Feed</h2>
                <div id="messageFeed" class="message-feed">
                    <div class="placeholder">Loading messages...</div>
                </div>
            </section>

            <!-- Devices Grid -->
            <section class="devices-section">
                <h2 id="devicesTitle">📱 All Devices</h2>
                <div id="loadingIndicator" class="loading" style="display:none;">
                    <div class="spinner"></div>
                    <p>Loading devices...</p>
                </div>
                <div id="devicesGrid" class="devices-grid">
                    <!-- Devices will be rendered here -->
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
