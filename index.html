<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATShadow · Firebase Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e14;
            color: #d4e0f0;
            font-family: 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 2px;
            border-bottom: 2px solid #2a3a4a;
            padding-bottom: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 1rem;
            color: #7a9ab5;
            background: #1a2530;
            padding: 6px 16px;
            border-radius: 30px;
        }
        .panel-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            height: calc(100vh - 140px);
        }
        .user-list {
            background: #131b24;
            border-radius: 12px;
            padding: 16px 8px 8px 16px;
            overflow-y: auto;
            border: 1px solid #253544;
        }
        .user-list input {
            width: 100%;
            background: #0f171f;
            border: 1px solid #2d4050;
            color: #d4e0f0;
            padding: 10px 14px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.9rem;
            margin-bottom: 16px;
            outline: none;
        }
        .user-list input:focus {
            border-color: #4a7a9c;
        }
        .user-item {
            padding: 8px 14px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.15s;
            border-left: 3px solid transparent;
            word-break: break-all;
        }
        .user-item:hover {
            background: #1d2a36;
            border-left-color: #5a8aaa;
        }
        .user-item.active {
            background: #1f3140;
            border-left-color: #8fcbff;
            color: #b6defa;
        }
        .user-count {
            font-size: 0.75rem;
            color: #6a8aa5;
            padding: 0 14px 12px 14px;
            border-bottom: 1px solid #1f2e3a;
            margin-bottom: 12px;
        }
        .detail-panel {
            background: #131b24;
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid #253544;
        }
        .detail-panel h2 {
            font-size: 1.3rem;
            font-weight: 400;
            color: #b0d0ea;
            margin-bottom: 6px;
        }
        .detail-panel .sub {
            color: #6a8aa5;
            font-size: 0.8rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #1f2e3a;
            padding-bottom: 12px;
        }
        .section-title {
            font-size: 1.1rem;
            font-weight: 400;
            color: #8ab4d8;
            margin: 24px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title span {
            background: #1f3140;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            color: #7a9ab5;
        }
        .card {
            background: #0f171f;
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-left: 4px solid #2d4a5e;
        }
        .card .head {
            display: flex;
            justify-content: space-between;
            color: #8ab4d8;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
        .card .head .app {
            background: #1a2530;
            padding: 0 10px;
            border-radius: 30px;
        }
        .card .msg {
            font-size: 0.9rem;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 80px;
            overflow-y: auto;
            color: #c8dae8;
        }
        .card .timestamp {
            font-size: 0.7rem;
            color: #5a7a95;
            margin-top: 6px;
            text-align: right;
        }
        .sms-card {
            border-left-color: #7a8a5a;
        }
        .sms-card .head .sender {
            background: #1a2a1a;
            padding: 0 10px;
            border-radius: 30px;
        }
        .sim-info {
            background: #0f171f;
            padding: 14px 18px;
            border-radius: 8px;
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            border: 1px solid #253544;
        }
        .sim-info div {
            font-size: 0.9rem;
        }
        .sim-info strong {
            color: #8ab4d8;
            margin-right: 8px;
        }
        .empty {
            color: #5a7a95;
            text-align: center;
            padding: 40px 0;
            font-style: italic;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0e14;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d4050;
            border-radius: 10px;
        }
        @media (max-width: 800px) {
            .panel-grid {
                grid-template-columns: 1fr;
                height: auto;
            }
            .user-list {
                max-height: 300px;
            }
            .detail-panel {
                max-height: 600px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        🐟 CATShadow · Firebase Panel
        <small id="totalUsers">loading users…</small>
    </h1>
    <div class="panel-grid">
        <!-- LEFT: user list -->
        <div class="user-list" id="userListContainer">
            <input type="text" id="searchInput" placeholder="🔍 filter users…" oninput="filterUsers()">
            <div class="user-count" id="userCount">0 users</div>
            <div id="userItems"></div>
        </div>

        <!-- RIGHT: detail view -->
        <div class="detail-panel" id="detailPanel">
            <h2>👤 Select a user</h2>
            <div class="sub">click any user from the left to load their full data</div>
            <div id="detailContent">
                <div class="empty">awaiting your command, Butter.</div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---- CONFIG ----
        const BASE_URL = 'https://sssssmmmmsw-default-rtdb.asia-southeast1.firebasedatabase.app';
        const USER_LIST_URL = `${BASE_URL}/users.json?shallow=true`;
        const USER_DETAIL_URL = (uid) => `${BASE_URL}/users/${uid}.json`;

        // ---- STATE ----
        let allUserIds = [];
        let filteredIds = [];
        let currentUid = null;
        let currentData = null;

        // ---- DOM refs ----
        const userItemsEl = document.getElementById('userItems');
        const searchInput = document.getElementById('searchInput');
        const userCountEl = document.getElementById('userCount');
        const totalUsersEl = document.getElementById('totalUsers');
        const detailContent = document.getElementById('detailContent');
        const detailPanel = document.getElementById('detailPanel');

        // ---- HELPERS ----
        function formatTimestamp(ts) {
            if (!ts) return '—';
            const d = new Date(ts);
            return d.toLocaleString('en-IN', { hour12: true, day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function formatTimestampMs(ms) {
            if (!ms) return '—';
            return formatTimestamp(ms);
        }

        // ---- RENDER USER LIST ----
        function renderUserList() {
            const search = searchInput.value.toLowerCase().trim();
            filteredIds = allUserIds.filter(id => id.toLowerCase().includes(search));
            userCountEl.textContent = `${filteredIds.length} user${filteredIds.length !== 1 ? 's' : ''}`;
            totalUsersEl.textContent = `📦 ${allUserIds.length} total`;

            if (filteredIds.length === 0) {
                userItemsEl.innerHTML = `<div class="empty" style="padding:20px 0;">no matching users</div>`;
                return;
            }

            let html = '';
            filteredIds.forEach(uid => {
                const active = (uid === currentUid) ? 'active' : '';
                html += `<div class="user-item ${active}" data-uid="${uid}" onclick="loadUser('${uid}')">${uid}</div>`;
            });
            userItemsEl.innerHTML = html;
        }

        // ---- LOAD USER DETAIL ----
        window.loadUser = function(uid) {
            if (uid === currentUid && currentData) {
                renderDetail(currentData, uid);
                return;
            }
            currentUid = uid;
            // highlight in list
            document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
            const target = document.querySelector(`.user-item[data-uid="${uid}"]`);
            if (target) target.classList.add('active');

            // fetch detail
            detailContent.innerHTML = `<div class="empty">⏳ loading ${uid}…</div>`;
            fetch(USER_DETAIL_URL(uid))
                .then(res => res.json())
                .then(data => {
                    currentData = data;
                    renderDetail(data, uid);
                })
                .catch(err => {
                    detailContent.innerHTML = `<div class="empty">⚠️ error loading user: ${err.message}</div>`;
                });
        };

        // ---- RENDER DETAIL ----
        function renderDetail(data, uid) {
            if (!data) {
                detailContent.innerHTML = `<div class="empty">⚠️ no data for this user</div>`;
                return;
            }

            let html = `<h2>🔑 ${uid}</h2><div class="sub">full record</div>`;

            // ---- SIM INFO ----
            if (data.simInfo) {
                const sim = data.simInfo;
                let simHtml = `<div class="section-title">📱 SIM Info</div><div class="sim-info">`;
                if (sim.sim0) {
                    simHtml += `<div><strong>SIM0:</strong> ${sim.sim0.carrierName || '—'} · ${sim.sim0.number || '—'} (slot ${sim.sim0.slotIndex ?? '?'})</div>`;
                }
                if (sim.sim1) {
                    simHtml += `<div><strong>SIM1:</strong> ${sim.sim1.carrierName || '—'} · ${sim.sim1.number || '—'} (slot ${sim.sim1.slotIndex ?? '?'})</div>`;
                }
                simHtml += `</div>`;
                html += simHtml;
            }

            // ---- NOTIFICATIONS ----
            if (data.notifications) {
                const keys = Object.keys(data.notifications);
                html += `<div class="section-title">🔔 Notifications <span>${keys.length}</span></div>`;
                if (keys.length === 0) {
                    html += `<div class="empty" style="padding:8px 0;">no notifications</div>`;
                } else {
                    const sorted = keys.sort((a, b) => {
                        const ta = data.notifications[a].timestamp || '';
                        const tb = data.notifications[b].timestamp || '';
                        return tb.localeCompare(ta);
                    });
                    sorted.forEach(key => {
                        const n = data.notifications[key];
                        html += `<div class="card">
                            <div class="head">
                                <span>${n.title || '📩'}</span>
                                <span class="app">${n.app || 'app'}</span>
                            </div>
                            <div class="msg">${n.message || ''}</div>
                            <div class="timestamp">${n.timestamp || '—'}</div>
                        </div>`;
                    });
                }
            }

            // ---- SMS LOGS ----
            if (data.sms_logs) {
                const keys = Object.keys(data.sms_logs);
                html += `<div class="section-title">✉️ SMS Logs <span>${keys.length}</span></div>`;
                if (keys.length === 0) {
                    html += `<div class="empty" style="padding:8px 0;">no SMS logs</div>`;
                } else {
                    const sorted = keys.sort((a, b) => {
                        const ta = data.sms_logs[a].timestamp || 0;
                        const tb = data.sms_logs[b].timestamp || 0;
                        return tb - ta;
                    });
                    sorted.forEach(key => {
                        const sms = data.sms_logs[key];
                        html += `<div class="card sms-card">
                            <div class="head">
                                <span>📨 from ${sms.sender || 'unknown'}</span>
                                <span class="sender">${sms.sender || '—'}</span>
                            </div>
                            <div class="msg">${sms.message || ''}</div>
                            <div class="timestamp">${sms.timestamp ? formatTimestampMs(sms.timestamp) : '—'}</div>
                        </div>`;
                    });
                }
            }

            // ---- fallback ----
            if (!data.notifications && !data.sms_logs && !data.simInfo) {
                html += `<div class="empty">no structured data found for this user</div>`;
            }

            detailContent.innerHTML = html;
        }

        // ---- FILTER ----
        window.filterUsers = function() {
            renderUserList();
            // if current user not in filter, clear detail
            if (currentUid && !filteredIds.includes(currentUid)) {
                currentUid = null;
                currentData = null;
                detailContent.innerHTML = `<div class="empty">user filtered out — select another</div>`;
            }
        };

        // ---- FETCH USER LIST ----
        function fetchUserList() {
            fetch(USER_LIST_URL)
                .then(res => res.json())
                .then(data => {
                    if (data && typeof data === 'object') {
                        allUserIds = Object.keys(data);
                    } else {
                        allUserIds = [];
                    }
                    renderUserList();
                    // auto‑load first user if any
                    if (allUserIds.length > 0) {
                        loadUser(allUserIds[0]);
                    } else {
                        detailContent.innerHTML = `<div class="empty">no users found in database</div>`;
                    }
                })
                .catch(err => {
                    userItemsEl.innerHTML = `<div class="empty">⚠️ failed to fetch user list: ${err.message}</div>`;
                    totalUsersEl.textContent = '⚠️ error';
                });
        }

        // ---- INIT ----
        fetchUserList();
    })();
</script>
</body>
</html>
